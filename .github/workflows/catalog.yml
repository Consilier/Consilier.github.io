name: Catalog hărți

on:
  schedule:
    - cron: "*/30 * * * *"     # la fiecare 30 de minute
  workflow_dispatch:            # buton „Run workflow” în tab-ul Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Construiește lista de hărți
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          OWNERS: "Consilier,hartiph"   # conturile/organizațiile ale căror hărți apar
          EXCLUDE: ""                   # repo-uri de ascuns, separate prin virgulă
          SELF: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, shutil, urllib.request, urllib.error
          from datetime import datetime, timezone
          from html import unescape

          TOKEN = os.environ.get("GH_TOKEN", "")
          if not TOKEN:
              raise SystemExit("Lipsește secretul CATALOG_TOKEN (Settings → Secrets and variables → Actions).")
          OWNERS = {o.strip().lower() for o in os.environ.get("OWNERS", "").split(",") if o.strip()}
          EXCLUDE = {e.strip().lower() for e in os.environ.get("EXCLUDE", "").split(",") if e.strip()}
          SELF = os.environ["SELF"].lower()
          SKIP_DIR = re.compile(r"^(lib|libs|assets|vendor|js|css|static|node_modules|fonts|img|images|icons|data|tiles|dist|build)$", re.I)

          def api(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          repos, page = [], 1
          while True:
              batch = api(f"/user/repos?per_page=100&page={page}&visibility=all"
                          "&affiliation=owner,organization_member,collaborator")
              repos += batch
              if len(batch) < 100:
                  break
              page += 1

          def wanted(r):
              if not r.get("has_pages") or r.get("archived"):
                  return False
              if r["full_name"].lower() == SELF:
                  return False
              if OWNERS and r["owner"]["login"].lower() not in OWNERS:
                  return False
              return r["name"].lower() not in EXCLUDE and r["full_name"].lower() not in EXCLUDE

          def title_of(full, sha):
              try:
                  blob = api(f"/repos/{full}/git/blobs/{sha}")
                  text = base64.b64decode(blob["content"]).decode("utf-8", "ignore")
                  m = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
                  return unescape(re.sub(r"\s+", " ", m.group(1))).strip() if m else None
              except Exception:
                  return None

          items = []
          for r in filter(wanted, repos):
              full = r["full_name"]
              base = f"https://{r['owner']['login'].lower()}.github.io/{r['name']}/"
              branch, root = r["default_branch"], ""
              try:
                  p = api(f"/repos/{full}/pages")
                  base = p.get("html_url") or base
                  src = p.get("source") or {}
                  branch = src.get("branch") or branch
                  root = (src.get("path") or "/").strip("/")
                  root = root + "/" if root else ""
              except Exception:
                  pass
              if not base.endswith("/"):
                  base += "/"

              found = []
              try:
                  tree = api(f"/repos/{full}/git/trees/{branch}?recursive=1").get("tree", [])
                  for t in tree:
                      path = t["path"]
                      if t["type"] != "blob" or not re.search(r"(^|/)index\.html$", path, re.I):
                          continue
                      if root and not path.startswith(root):
                          continue
                      rel = re.sub(r"/?index\.html$", "", path[len(root):], flags=re.I)
                      segs = rel.split("/") if rel else []
                      if len(segs) > 3 or any(SKIP_DIR.match(s) or s[:1] in "._" for s in segs):
                          continue
                      found.append((rel, t["sha"]))
              except Exception as e:
                  print(f"  {full}: nu pot citi fișierele ({e})")
              if not found:
                  found = [("", None)]

              for rel, sha in found:
                  name = (rel.split("/")[-1] if rel else r["name"]).replace("-", " ").replace("_", " ")
                  items.append({
                      "owner": r["owner"]["login"],
                      "repo": r["name"],
                      "path": rel,
                      "private": r["private"],
                      "url": base + (rel + "/" if rel else ""),
                      "title": (sha and title_of(full, sha)) or name,
                      "desc": "" if rel else (r.get("description") or ""),
                      "updated": r["pushed_at"],
                  })
              print(f"  {full}: {len(found)} hartă/hărți")

          items.sort(key=lambda x: x["updated"] or "", reverse=True)
          os.makedirs("site", exist_ok=True)
          shutil.copy("index.html", "site/index.html")
          with open("site/maps.json", "w", encoding="utf-8") as f:
              json.dump({"generated": datetime.now(timezone.utc).isoformat(), "items": items}, f, ensure_ascii=False)
          print(f"Total: {len(items)} hărți")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
